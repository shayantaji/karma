{% load poll_extras %}
<div class="col-lg-4 col-md-6">

                                <div class="single-product">
                                     <a href="{{ product.get_absolute_url }}">
                                    <img class="img-fluid"

                                         src="{{ product.main_image.image.url }}"
                                         alt="{{ product.title }}">
                                     </a>
                                    <div class="product-details">

                                        <h6>{{ product.title }}</h6>

                                        <div class="price">

                                            <h6>
                                                {{ product.price | three_digits_currency }}
                                            </h6>

                                            {% if product.old_price %}
                                                <h6 class="l-through">
                                                    {{ product.old_price }}
                                                </h6>
                                            {% endif %}

                                        </div>

                                        <div class="prd-bottom">

                                            <a href="#" class="social-info">
                                                <span class="ti-bag"></span>
                                                <p class="hover-text">افزودن به سبد</p>
                                            </a>

                                            <a href="#" class="social-info">
                                                <span class="lnr lnr-heart"></span>
                                                <p class="hover-text">لیست آرزوها</p>
                                            </a>

{#                                            <a href="#" class="social-info">#}
{#                                                <span class="lnr lnr-sync"></span>#}
{#                                                <p class="hover-text">مقایسه</p>#}
{#                                            </a>#}

                                            <a href="{{ product.get_absolute_url }}" class="social-info">
                                                <span class="lnr lnr-move"></span>
                                                <p class="hover-text">مشاهده بیشتر</p>
                                            </a>

                                        </div>

                                    </div>

                                </div>

                            </div>
